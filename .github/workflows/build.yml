name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WarpSearch API keys belong in secrets, never in the repository
      - name: Check for committed API keys
        run: |
          if git grep -nE 'ws_(live|test)_[A-Za-z0-9]{16,}'; then
            echo "::error::A WarpSearch API key is committed. Remove it, revoke it in the WarpSearch console and use the WARPSEARCH_API_KEY secret."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release

      # the integration tests need a WarpSearch key; without one (forks, or before the secret is set) only the
      # tests that need no WarpSearch run
      - name: Test
        env:
          WARPSEARCH_API_KEY: ${{ secrets.WARPSEARCH_API_KEY }}
          WARPSEARCH_COLLECTION: ${{ vars.WARPSEARCH_COLLECTION }}
        run: |
          if [ -n "$WARPSEARCH_API_KEY" ]; then
            dotnet test -c Release --no-build
          else
            echo "::notice::WARPSEARCH_API_KEY is not set; skipping the WarpSearch integration tests."
            dotnet test -c Release --no-build --filter "TestCategory!=Integration"
          fi

      - run: dotnet pack src/WarpSearch.Umbraco.Search -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
