name: Release

# push a version tag to publish that version to NuGet, e.g. 18.0.1, v18.0.1 or 18.1.0-beta.1 for a prerelease;
# the Umbraco Marketplace lists new versions from NuGet by itself
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  # lets the job ask GitHub for the OIDC token that NuGet trusted publishing exchanges for a short-lived API key
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # the nuget.org trusted publishing policy is limited to this environment
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - name: Get the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version such as 18.0.1 or 18.1.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Check for committed API keys
        run: |
          if git grep -nE 'ws_(live|test)_[A-Za-z0-9]{16,}'; then
            echo "::error::A WarpSearch API key is committed. Remove it, revoke it in the WarpSearch console and use the WARPSEARCH_API_KEY secret."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        env:
          WARPSEARCH_API_KEY: ${{ secrets.WARPSEARCH_API_KEY }}
          WARPSEARCH_COLLECTION: ${{ vars.WARPSEARCH_COLLECTION }}
        run: |
          if [ -n "$WARPSEARCH_API_KEY" ]; then
            dotnet test -c Release --no-build
          else
            echo "::warning::WARPSEARCH_API_KEY is not set; releasing without the WarpSearch integration tests."
            dotnet test -c Release --no-build --filter "TestCategory!=Integration"
          fi

      - run: dotnet pack src/WarpSearch.Umbraco.Search -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      # trusted publishing: no stored NuGet API key; the key from this step is valid for an hour, so it is requested
      # right before the push
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # the nuget.org account that owns the trusted publishing policy (its profile name, not an email)
          user: warpsearch

      # pushes the symbol package (.snupkg) next to it as well
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
