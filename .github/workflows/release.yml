name: Release

# push a tag such as v18.0.0 to publish that version to NuGet
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        env:
          WARPSEARCH_API_KEY: ${{ secrets.WARPSEARCH_API_KEY }}
          WARPSEARCH_COLLECTION: ${{ vars.WARPSEARCH_COLLECTION }}
        run: |
          if [ -n "$WARPSEARCH_API_KEY" ]; then
            dotnet test -c Release
          else
            echo "::warning::WARPSEARCH_API_KEY is not set; releasing without the WarpSearch integration tests."
            dotnet test -c Release --filter "TestCategory!=Integration"
          fi
      - run: dotnet pack src/WarpSearch.Umbraco.Search -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
